name: Task 5 - Build, Infrastructure and Application Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read


# ============================================================
# STAGE 1 - BUILD
# ============================================================

jobs:

  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task5-app

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task5-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Create Deployment Package
        run: |
          zip -r ../task5-app.zip . \
            -x "node_modules/*" \
            -x ".git/*"

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task5-app
          path: task5-app.zip


  # ============================================================
  # STAGE 2 - DEPLOY INFRASTRUCTURE
  # ============================================================

  deploy-infra:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: environments/task5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================

  deploy-app:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest

    needs: deploy-infra

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: task5-app
          path: ./deployment

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-devopsapp-task5
          package: ./deployment/task5-app.zip