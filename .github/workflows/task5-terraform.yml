name: Task 5 - Build, Infrastructure and Application Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.13.3"

  APP_NAME: "app-devopsapp-task5"
  TERRAFORM_DIR: "environments/task5"

jobs:

  # ==========================================================
  # STAGE 1 - BUILD APPLICATION
  # ==========================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task5-app/package-lock.json

      - name: Install Dependencies
        working-directory: task5-app
        run: npm ci

      - name: Create Deployment Package
        run: |
          cd task5-app

          zip -r ../task5-app.zip . \
            -x "node_modules/.cache/*" \
            -x "*.log"

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task5-app-package
          path: task5-app.zip
          retention-days: 1


  # ==========================================================
  # STAGE 2 - DEPLOY INFRASTRUCTURE
  # ==========================================================
  deploy-infrastructure:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false


  # ==========================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ==========================================================
  deploy-application:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest

    needs: deploy-infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: task5-app-package
          path: ./artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./artifact/task5-app.zip

      - name: Verify Application
        run: |
          echo "Application deployed successfully."
          echo "URL: https://${{ env.APP_NAME }}.azurewebsites.net"