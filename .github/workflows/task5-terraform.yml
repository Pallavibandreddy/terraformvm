name: Task 5 - Build, Infrastructure and Application Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.13.3"

  APP_NAME: "app-devopsapp-task5"
  TERRAFORM_DIR: "environments/task5"

jobs:

  # ==========================================================
  # STAGE 1 - BUILD APPLICATION
  # ==========================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task5-app/package-lock.json

      - name: Install Dependencies
        working-directory: task5-app
        run: npm ci

      - name: Create Deployment Package
        run: |
          cd task5-app

          zip -r ../task5-app.zip . \
            -x "node_modules/.cache/*" \
            -x "*.log"

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task5-app-package
          path: task5-app.zip
          retention-days: 1


    # ==========================================================
  # STAGE 2 - DEPLOY INFRASTRUCTURE
  # ==========================================================
  deploy-infrastructure:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Create terraform.tfvars on the GitHub runner
      - name: Create Terraform Variables
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          location            = "India South Central"
          environment         = "task5"
          project_name        = "devopsapp"
          resource_group_name = "rg-devopsapp-task5"
          key_vault_name      = "kv-devopsapp-task5"

          vnet_name          = "vnet-devopsapp-task5"
          vnet_address_space = "10.0.0.0/16"

          subnet_name           = "app-subnet"
          subnet_address_prefix = "10.0.1.0/24"

          private_endpoint_subnet_name           = "private-endpoint-subnet"
          private_endpoint_subnet_address_prefix = "10.0.2.0/24"

          nsg_name = "nsg-devopsapp-task5"

          nic_config = {}

          app_service_name      = "app-devopsapp-task5"
          app_service_plan_name = "asp-devopsapp-task5"
          app_service_sku       = "B1"

          enable_app_service_delegation = true

          sql_server_name             = "sql-devopsapp-task5"
          sql_database_name           = "sqldb-devopsapp-task5"
          sql_administrator_login     = "${{ secrets.SQL_ADMINISTRATOR_LOGIN }}"
          sql_administrator_object_id = "6ffb023d-82d9-495e-a91b-8488f8dc84ea"

          application_insights_name = "appi-devopsapp-task5"
          log_analytics_name        = "law-devopsapp-task5"
          EOF

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"

  # ==========================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ==========================================================
  deploy-application:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest

    needs: deploy-infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: task5-app-package
          path: ./artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./artifact/task5-app.zip

      - name: Verify Application
        run: |
          echo "Application deployed successfully."
          echo "URL: https://${{ env.APP_NAME }}.azurewebsites.net"