name: Task 6 Full Stack CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ==================================================
  # DETECT CHANGES
  # ==================================================

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect UI and API changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'task6-app/ui/**'

            api:
              - 'task6-app/api/**'


  # ==================================================
  # STAGE 1 - BUILD UI
  # ==================================================

  build-ui:
    name: Build UI
    needs: detect-changes

    if: needs.detect-changes.outputs.ui_changed == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task6-app/ui

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task6-app/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        env:
          VITE_API_URL: https://task6-api.azurewebsites.net
        run: npm run build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: task6-app/ui/dist


  # ==================================================
  # STAGE 2 - BUILD API
  # ==================================================

  build-api:
    name: Build API
    needs: detect-changes

    if: needs.detect-changes.outputs.api_changed == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task6-app/api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task6-app/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: |
            task6-app/api/package.json
            task6-app/api/package-lock.json
            task6-app/api/server.js


  # ==================================================
  # STAGE 3 - DEPLOY UI
  # ==================================================

  deploy-ui:
    name: Deploy UI
    needs:
      - detect-changes
      - build-ui

    if: >
      needs.detect-changes.outputs.ui_changed == 'true' &&
      needs.build-ui.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui-dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare UI deployment package
        run: |
          cd ui-dist
          zip -r ../ui.zip .

      - name: Deploy UI
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.UI_APP_NAME }}
          package: ui.zip


  # ==================================================
  # STAGE 4 - DEPLOY API
  # ==================================================

  deploy-api:
    name: Deploy API
    needs:
      - detect-changes
      - build-api

    if: >
      needs.detect-changes.outputs.api_changed == 'true' &&
      needs.build-api.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare API deployment package
        run: |
          cd api
          zip -r ../api.zip .

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: api.zip