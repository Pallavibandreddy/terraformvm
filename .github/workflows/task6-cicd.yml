name: Task 6 Full Stack CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'task6-app/**'
      - 'environments/task6/**'
      - '.github/workflows/task6-cicd.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: "1.13.3"
  TERRAFORM_DIR: "environments/task6"

jobs:

  # ==================================================
  # STAGE 0 - TERRAFORM INFRASTRUCTURE
  # ==================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure identity
        run: |
          az account show \
            --query "{subscription:id,tenantId:tenantId,user:user}" \
            -o json

      - name: Check service principal
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          az ad sp show \
            --id "$CLIENT_ID" \
            --query "{appId:appId,objectId:id,displayName:displayName}" \
            -o table

      - name: Check Storage role
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          OBJECT_ID=$(az ad sp show \
            --id "$CLIENT_ID" \
            --query id \
            -o tsv)

          echo "Service Principal Object ID: $OBJECT_ID"

          az role assignment list \
            --assignee "$OBJECT_ID" \
            --scope "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-tfstate-fullstack/providers/Microsoft.Storage/storageAccounts/stfullstackcicd2026" \
            --include-inherited \
            --query "[].{role:roleDefinitionName,scope:scope}" \
            -o table

      - name: Test Storage Blob access
        run: |
          az storage blob list \
            --account-name stfullstackcicd2026 \
            --container-name tfstate \
            --auth-mode login \
            -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="ui_app_name=${{ secrets.UI_APP_NAME }}" \
            -var="api_app_name=${{ secrets.API_APP_NAME }}"

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="ui_app_name=${{ secrets.UI_APP_NAME }}" \
            -var="api_app_name=${{ secrets.API_APP_NAME }}"

  # ==================================================
  # DETECT CHANGES
  # ==================================================

  detect-changes:
    name: Detect Changes
    needs: terraform
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect UI and API changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'task6-app/ui/**'

            api:
              - 'task6-app/api/**'


  # ==================================================
  # STAGE 1 - BUILD UI
  # ==================================================

  build-ui:
    name: Build UI
    needs: detect-changes

    if: needs.detect-changes.outputs.ui_changed == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task6-app/ui

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task6-app/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        env:
          VITE_API_URL: https://task6-api.azurewebsites.net
        run: npm run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: |
            task6-app/ui/dist
            task6-app/ui/package.json
            task6-app/ui/package-lock.json


  # ==================================================
  # STAGE 2 - BUILD API
  # ==================================================

  build-api:
    name: Build API
    needs: detect-changes

    if: needs.detect-changes.outputs.api_changed == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task6-app/api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task6-app/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: |
            task6-app/api/package.json
            task6-app/api/package-lock.json
            task6-app/api/server.js


  # ==================================================
  # STAGE 3 - DEPLOY UI
  # ==================================================

  deploy-ui:
    name: Deploy UI
    needs:
      - detect-changes
      - build-ui

    if: >
      needs.detect-changes.outputs.ui_changed == 'true' &&
      needs.build-ui.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare UI deployment package
        run: |
          cd ui
          zip -r ../ui.zip .

      - name: Deploy UI
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.UI_APP_NAME }}
          package: ui.zip


  # ==================================================
  # STAGE 4 - DEPLOY API
  # ==================================================

  deploy-api:
    name: Deploy API
    needs:
      - detect-changes
      - build-api

    if: >
      needs.detect-changes.outputs.api_changed == 'true' &&
      needs.build-api.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare API deployment package
        run: |
          cd api
          zip -r ../api.zip .

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.API_APP_NAME }}
          package: api.zip