name: Task 7 Vault Access Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  vault-test:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read version from Azure Key Vault
        uses: azure/cli@v2
        with:
          inlineScript: |
            VERSION=$(az keyvault secret show \
              --vault-name "kv-task7-version-pgsn" \
              --name "app-version" \
              --query value \
              --output tsv)

            echo "Current application version: $VERSION"